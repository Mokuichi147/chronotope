[workspace]
resolver = "3"
members = [
    "crates/chronotope-core",
    "crates/chronotope-engine",
    "crates/chronotope-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
chronotope-core = { path = "crates/chronotope-core" }
chronotope-engine = { path = "crates/chronotope-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
thiserror = "2"
blake3 = "1"
roaring = "0.10"
half = "2"
chacha20poly1305 = "0.10"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
